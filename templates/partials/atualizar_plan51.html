<div class="grid">
  <div class="card">
    <div class="card-title">PLAN 51</div>
    <p class="muted">Envie o arquivo .xlsx do PLAN 51 (Relação Detalhada de Créditos Adicionais, emitido com FLAG_STATUS igual a Efetivado) e informe a data/hora do download. O relatório é do estado inteiro: todas as UOs são gravadas.</p>

    <form id="form-plan51" class="form">
      <div class="form-grid">
        <label class="field">
          <span>Arquivo PLAN 51 (.xlsx)</span>
          <input type="file" name="arquivo" id="plan51-file" accept=".xlsx" required />
        </label>
        <label class="field">
          <span>Data/hora do download</span>
          <input type="datetime-local" name="data_arquivo" id="plan51-data" required />
        </label>
      </div>
      <div class="actions">
        <button class="btn btn-primary sm" type="submit" id="plan51-submit">Upload e processar</button>
        <div id="plan51-loading" class="muted" style="display:none;">⏳ Processando...</div>
        <div id="plan51-msg" class="muted"></div>
      </div>
    </form>
  </div>

  <div class="card">
    <div class="card-title">Última atualização</div>
    <div id="plan51-status" class="muted">Carregando...</div>
  </div>
</div>
