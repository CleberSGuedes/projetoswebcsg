<div class="grid">
  <div class="card plan20-card">
    <div class="card-title">PLAN 51 - Relação Detalhada de Créditos Adicionais</div>
    <div class="actions relatorio-top relatorio-top-uo">
      <div class="muted" id="plan51-relatorio-meta">Carregando...</div>
      <div class="relatorio-top-right">
        <div class="totais-box">
          <div class="totais-title">Totais (filtros aplicados)</div>
          <div class="totais-row"><span>Exercício:</span> <strong id="plan51-tot-exercicio">-</strong></div>
          <div class="totais-row"><span>Total Suplementado:</span> <strong id="plan51-tot-supl">0</strong></div>
          <div class="totais-row"><span>Total Anulado:</span> <strong id="plan51-tot-anul">0</strong></div>
          <div class="totais-row"><span>Líquido:</span> <strong id="plan51-tot-liquido">0</strong></div>
        </div>
        <div class="actions" style="gap:8px;">
          <button class="btn sm compact" id="plan51-reset" type="button"><i class="bi bi-eraser"></i><span>Limpar Filtros</span></button>
          <button class="btn sm compact" id="plan51-download" type="button"><i class="bi bi-download"></i><span>Baixar Excel</span></button>
        </div>
      </div>
    </div>
    <div id="plan51-empty" class="report-empty-state" hidden>Consulta sem resultados.</div>
    <div class="table-responsive">
      <table class="table plan20-table" id="plan51-relatorio-tabela">
        <thead>
          <!-- Cabecalho e linha de filtro montados por JS (initRelatorioPlan51,
               static/js/main.js) a partir de data.columns, devolvido pela API
               (services/plan51_runner.py, PLAN51_COLUNAS). -->
          <tr id="plan51-header-row"></tr>
          <tr class="filter-row" id="plan51-filter-row"></tr>
        </thead>
        <tbody></tbody>
        <tfoot id="plan51-foot"></tfoot>
      </table>
    </div>
    <div class="table-foot">
      <div class="page-size">
        <label for="plan51-page-size">Itens por página</label>
        <select id="plan51-page-size" class="input">
          <option value="10">10</option>
          <option value="20" selected>20</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
      </div>
      <div id="plan51-pagination" class="pagination"></div>
    </div>
  </div>
</div>
