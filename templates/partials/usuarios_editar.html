<div class="grid">
  <header class="module-header"><div class="module-header-copy"><div class="module-eyebrow">Administração · Usuários</div><h1>Editar usuário</h1><p>Atualize identificação, perfil e situação do acesso.</p></div><i class="bi bi-person-gear" aria-hidden="true"></i></header>
  <div class="card module-card">
    <div class="card-title">Editar Usuário</div>
    <form id="form-editar-usuario" class="form">
      <input type="hidden" name="id" id="edit-id" />
      <div class="form-grid">
        <label class="field">
          <span>Email</span>
          <input type="email" id="edit-email" required />
        </label>
        <label class="field">
          <span>Nome</span>
          <input type="text" id="edit-nome" required />
        </label>
        <label class="field">
          <span>Perfil</span>
          <select id="edit-perfil" required>
            <option value="">Selecione um perfil</option>
            {% for p in perfis %}
            <option value="{{ p.id }}">{{ p.nome }}</option>
            {% endfor %}
          </select>
        </label>
        <label class="field">
          <span>Senha (deixe em branco para manter)</span>
          <div class="password-wrap">
            <input type="password" id="edit-senha" />
            <button class="toggle-visibility" type="button" data-target="edit-senha" aria-label="Mostrar ou ocultar senha">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </label>
        <label class="field inline">
          <input type="checkbox" id="edit-ativo" />
          <span>Ativo</span>
        </label>
      </div>
      <div class="actions">
        <button class="btn btn-primary sm" type="submit">Salvar alterações</button>
        <div id="editar-usuario-msg" class="muted"></div>
      </div>
    </form>
  </div>

  <div class="card users-list-card">
    <div class="card-title">Usuários</div>
    <label class="users-search" for="usuarios-editar-search"><i class="bi bi-search"></i><input id="usuarios-editar-search" type="search" placeholder="Pesquisar por nome, e-mail ou perfil" autocomplete="off" /></label>
    <div class="table-responsive">
      <table class="table">
        <thead>
          <tr>
            <th>Email</th>
            <th>Nome</th>
            <th>Perfil</th>
            <th>Ativo</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="usuarios-editar-tbody">
          {% for u in usuarios %}
          <tr data-id="{{ u.id }}"
              data-email="{{ u.email }}"
              data-nome="{{ u.nome }}"
              data-perfil="{{ u.perfil }}"
              data-perfil-id="{{ u.perfil_id or '' }}"
              data-ativo="{{ '1' if u.ativo else '0' }}">
            <td>{{ u.email }}</td>
            <td>{{ u.nome }}</td>
            <td>{{ u.perfil }}</td>
            <td>{{ 'Sim' if u.ativo else 'Não' }}</td>
            <td class="actions users-row-actions">
              <button class="icon-btn sm select-usuario" data-email="{{ u.email }}" type="button" title="Editar"><i class="bi bi-pencil"></i></button>
              <button class="icon-btn sm delete-usuario" data-id="{{ u.id }}" data-nome="{{ u.nome }}" type="button" title="Excluir"><i class="bi bi-trash"></i></button>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
