<div class="grid">
  <header class="module-header"><div class="module-header-copy"><div class="module-eyebrow">Administrar SPO · PTA-Gerencial NGER</div><h1>Atualizar PLAN-20 FIPLAN</h1><p>Envie a base mais recente e acompanhe o processamento.</p></div><i class="bi bi-file-earmark-spreadsheet" aria-hidden="true"></i></header>
  <div class="card module-card">
    <div class="module-card-title"><i class="bi bi-file-earmark-spreadsheet"></i><div><h2>Arquivo para processamento</h2><p>Informe o arquivo e a data de referência.</p></div></div>
    <p class="muted">Envie o arquivo .xlsx e informe a data/hora do download.</p>

    <form id="form-plan20" class="form">
      <div class="form-grid">
        <label class="field">
          <span>Arquivo Plan20 (.xlsx)</span>
          <input type="file" name="arquivo" id="plan20-file" accept=".xlsx" required />
        </label>
        <label class="field">
          <span>Data/hora do download</span>
          <input type="datetime-local" name="data_arquivo" id="plan20-data" required />
        </label>
      </div>
      <div class="actions">
        <button class="btn btn-primary sm" type="submit" id="plan20-submit">Upload e processar</button>
        <div id="plan20-loading" class="muted" style="display:none;">⏳ Processando...</div>
        <div id="plan20-msg" class="muted"></div>
      </div>
    </form>
  </div>

  <div class="card">
    <div class="card-title">Última atualização</div>
    <div id="plan20-status" class="muted">Carregando...</div>
  </div>
</div>
