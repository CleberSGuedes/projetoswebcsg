<section
  id="estrutura-componentes-page"
  class="planning-admin-page"
  data-configs='{{ component_configs|tojson }}'
>
  <div class="planning-structure-header module-header module-header-with-controls">
    <div class="module-header-copy">
      <div class="module-eyebrow">Administrar SPO · Estrutura do Planejamento</div>
      <div class="card-title">Componentes da Estrutura do Planejamento</div>
      <p class="muted">Cadastre e mantenha os componentes utilizados nas chaves e nos formulários de planejamento.</p>
    </div>
  </div>

  <div class="card planning-admin-selector">
    <label class="field">
      <span>*Tipo de componente</span>
      <select id="estrutura-componente-tipo">
        {% for config in component_configs %}
        <option value="{{ config.key }}">{{ config.title }}</option>
        {% endfor %}
      </select>
    </label>
  </div>

  <div class="planning-structure-layout">
    <div class="card">
      <div class="card-title" id="estrutura-componente-form-title">Componente</div>
      <form id="estrutura-componente-form" class="form" novalidate>
        <input type="hidden" id="estrutura-componente-id" />
        <div id="estrutura-componente-fields" class="form-grid planning-admin-form-grid"></div>
        <div class="actions">
          <button class="btn btn-primary sm" type="submit">
            <i class="bi bi-floppy"></i>Salvar
          </button>
          <button class="btn btn-secondary sm" type="button" id="estrutura-componente-limpar">
            <i class="bi bi-eraser"></i>Limpar
          </button>
          <div id="estrutura-componente-msg" class="muted" role="status"></div>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="planning-structure-list-header">
        <div class="card-title" id="estrutura-componente-list-title">Registros cadastrados</div>
        <button class="icon-btn" type="button" id="estrutura-componente-atualizar" title="Atualizar lista">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
      </div>
      <div class="form-grid planning-structure-filter-grid no-print">
        <label class="field">
          <span>Situação</span>
          <select id="estrutura-componente-filtro-status">
            <option value="">Todos</option>
            <option value="1">Ativos</option>
            <option value="0">Inativos</option>
          </select>
        </label>
        <label class="field planning-structure-filter-search">
          <span>Pesquisar</span>
          <input type="search" id="estrutura-componente-filtro-texto" placeholder="Código, nome ou descrição" />
        </label>
      </div>
      <div class="table-responsive planning-structure-table-wrap">
        <table class="table">
          <thead id="estrutura-componente-table-head"></thead>
          <tbody id="estrutura-componente-table-body"></tbody>
        </table>
      </div>
      <div class="table-foot no-print">
        <div class="page-size">
          <label for="estrutura-componente-page-size">Itens por página</label>
          <select id="estrutura-componente-page-size" class="input">
            <option value="10" selected>10</option>
            <option value="20">20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </div>
        <div id="estrutura-componente-pagination" class="pagination"></div>
      </div>
    </div>
  </div>

  <div class="card planning-component-links-card" id="estrutura-componente-links-card" hidden>
    <div class="planning-structure-list-header">
      <div>
        <div class="card-title" id="estrutura-componente-links-title">Vínculos do componente</div>
        <p class="muted" id="estrutura-componente-links-selected"></p>
      </div>
      <button class="icon-btn" type="button" id="estrutura-componente-links-close" title="Fechar vínculos">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="form-grid planning-component-links-grid">
      <label class="field">
        <span>*Tipo de vínculo</span>
        <select id="estrutura-componente-links-tipo"></select>
      </label>
      <label class="field planning-component-links-target">
        <span id="estrutura-componente-links-destino-label">*Registro relacionado</span>
        <select id="estrutura-componente-links-destino">
          <option value="">Selecione...</option>
        </select>
      </label>
      <div class="actions planning-component-links-actions">
        <button class="btn btn-primary sm" type="button" id="estrutura-componente-links-add">
          <i class="bi bi-link-45deg"></i>Vincular
        </button>
      </div>
    </div>
    <div id="estrutura-componente-links-msg" class="muted" role="status"></div>

    <div class="table-responsive planning-structure-table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th id="estrutura-componente-links-table-label">Registro relacionado</th>
            <th class="planning-structure-actions-column">Ações</th>
          </tr>
        </thead>
        <tbody id="estrutura-componente-links-body"></tbody>
      </table>
    </div>
  </div>
</section>
