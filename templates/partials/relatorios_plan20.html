<div class="grid">
  <header class="report-header"><div class="report-header-copy"><div class="report-eyebrow">Relatórios · Planejamento</div><h1>PLAN20 - SEDUC</h1><p>Consulte o planejamento anual, refine os dados e exporte a visão atual.</p></div><i class="bi bi-file-earmark-spreadsheet" aria-hidden="true"></i></header>
  <div class="card plan20-card report-data-card">
    <div class="actions relatorio-top">
      <div class="muted" id="plan20-relatorio-meta">Carregando...</div>
      <div class="relatorio-top-right">
        <div class="totais-box">
          <div class="totais-title">Totais (filtros aplicados)</div>
          <div class="totais-row"><span>Exercício:</span> <strong id="plan20-tot-exercicio">-</strong></div>
          <div class="totais-row"><span>Valor Total:</span> <strong id="plan20-tot-valor-total">0</strong></div>
        </div>
        <div class="actions report-actions">
          <button class="btn sm compact" id="plan20-reset" type="button"><i class="bi bi-eraser"></i><span>Limpar Filtros</span></button>
          <button class="btn sm compact" id="plan20-download" type="button"><i class="bi bi-download"></i><span>Baixar Excel</span></button>
        </div>
      </div>
    </div>
    <div id="plan20-empty" class="report-empty-state" hidden>Consulta sem resultados.</div>
    <div class="table-responsive">
      <table class="table plan20-table" id="plan20-relatorio-tabela">
        <thead>
          <!-- Cabecalho e linha de filtro montados por JS (initRelatorioPlan20,
               static/js/main.js) a partir de data.columns, devolvido pela API -
               fonte unica com o SELECT do backend (rotas/home_routes.py,
               PLAN20_RELATORIO_COLUNAS). Evita 3 listas de colunas
               desincronizaveis (docs/claude.md, secao 19). -->
          <tr id="plan20-header-row"></tr>
          <tr class="filter-row" id="plan20-filter-row"></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="table-foot">
      <div class="page-size">
        <label for="plan20-page-size">Itens por página</label>
        <select id="plan20-page-size" class="input">
          <option value="10">10</option>
          <option value="20" selected>20</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
      </div>
      <div id="plan20-pagination" class="pagination"></div>
    </div>
  </div>
</div>
